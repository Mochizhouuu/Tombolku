name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/Tombolku.jks
          ls -la $RUNNER_TEMP/Tombolku.jks
          echo "KEYSTORE_FILE=$RUNNER_TEMP/Tombolku.jks" >> $GITHUB_ENV

      - name: Check environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          which java
          java -version
          which gradle || echo "gradle not found in PATH"
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || echo "No build-tools in standard path"
          find /usr -name "build-tools" -type d 2>/dev/null | head -3

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -100
          echo "Exit code: $?"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tombolku-release
          path: app/build/outputs/apk/release/*.apk