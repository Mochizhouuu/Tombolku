name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/Tombolku.jks
          echo "KEYSTORE_FILE=$RUNNER_TEMP/Tombolku.jks" >> $GITHUB_ENV

      - name: Validate secrets
        run: |
          test -n "${{ secrets.KEY_ALIAS }}" || exit 1
          test -n "${{ secrets.KEYSTORE_PASSWORD }}" || exit 1
          test -n "${{ secrets.KEY_PASSWORD }}" || exit 1

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tombolku-release
          path: app/build/outputs/apk/release/*.apk