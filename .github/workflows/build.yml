name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/Tombolku.jks
          echo "KEYSTORE_FILE=$RUNNER_TEMP/Tombolku.jks" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/Tombolku.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          HASH=$(sha256sum "$APK" | awk '{print $1}')
          {
            echo "## Build info"
            echo ""
            echo "- APK: \`$APK\`"
            echo "- SHA-256: \`$HASH\`"
            echo ""
            echo '```'
            "$APKSIGNER" verify --verbose "$APK"
            echo '```'
            echo ""
            echo '```'
            "$APKSIGNER" verify --print-certs "$APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $HASH"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tombolku-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
