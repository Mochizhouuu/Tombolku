name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: List outputs
        run: find app/build/outputs -type f -name "*.apk" | xargs ls -la

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: tombolku-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error